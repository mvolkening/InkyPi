<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<div class="form-group">
    <label class="form-label">Location: </label>
    <div class="form-group">
        <span>Latitude </span>
        <input type="text" id="latitude" name="latitude" class="form-input" />
    </div>
    <div class="form-group">
        <span>Longitude </span>
        <input type="text" id="longitude" name="longitude" class="form-input" />
    </div>
    <button type="button" id="openMap" class="action-button compact">Select Location</button>
</div>

<div class="form-group">
    <label for="units" class="form-label">Units:</label>
    <select id="units" name="units" class="form-input">
        <option value="imperial">Imperial (°F, mph, in)</option>
        <option value="metric">Metric (°C, km/h, mm)</option>
    </select>
</div>

<div class="form-group">
    <label for="customTitle" class="form-label">Title:</label>
    <input type="text" id="customTitle" name="customTitle" class="form-input" placeholder="Solunar Calendar" />
</div>

<div class="form-group">
    <label for="highColor" class="form-label">High Activity Color:</label>
    <input type="color" id="highColor" name="highColor" class="color-picker" value="#7fd37f" />
    <span title="Background of high-activity days. Deep, saturated colors tend to render more faithfully than pale ones on e-ink.">ⓘ</span>
</div>

<div id="mapModal" class="modal">
    <div class="modal-content">
        <span class="close-button" onclick="closeModal('mapModal')">×</span>
        <h2 id="modalTitle">Select Location</h2>
        <div class="separator"></div>
        <div id="map" style="width: 100%; height: 200px; margin: 10px 0px;"></div>
        <button id="closeMap" class="action-button">Save</button>
    </div>
</div>

<script>
    function hasCoord(value) {
        return typeof value === 'string' && value.trim() !== '' && Number.isFinite(Number(value));
    }

    function parseCoord(value, fallback) {
        return hasCoord(value) ? Number(value) : fallback;
    }

    /** Validate lat/long inputs. Returns true if valid. */
    function validateCoordInputs() {
        const latVal = document.getElementById('latitude').value.trim();
        const longVal = document.getElementById('longitude').value.trim();

        if (latVal === '' || longVal === '') {
            showResponseModal('failure', 'Error! Both latitude and longitude are required.');
            return false;
        }
        if (!hasCoord(latVal) || !hasCoord(longVal)) {
            showResponseModal('failure', 'Error! Latitude and longitude must be valid numbers.');
            return false;
        }
        if (Number(latVal) < -90 || Number(latVal) > 90) {
            showResponseModal('failure', 'Error! Latitude must be between -90 and 90.');
            return false;
        }
        if (Number(longVal) < -180 || Number(longVal) > 180) {
            showResponseModal('failure', 'Error! Longitude must be between -180 and 180.');
            return false;
        }
        return true;
    }

    const solunarHandleAction = window.handleAction;
    window.handleAction = async function(action) {
        if (!validateCoordInputs()) {
            return;
        }
        return solunarHandleAction(action);
    };

    const solunarOpenModal = window.openModal;
    window.openModal = function(modalId) {
        if (modalId === 'scheduleModal' && !validateCoordInputs()) {
            return;
        }
        return solunarOpenModal(modalId);
    };

    document.addEventListener('DOMContentLoaded', () => {
        const OSM_TILE_URL = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
        const $latitude = document.querySelector('#latitude');
        const $longitude = document.querySelector('#longitude');
        const $openMap = document.querySelector('#openMap');
        const $closeMap = document.querySelector('#closeMap');

        let latitude = 0;
        let longitude = 0;
        let zoom = 2.5;
        let map, marker;
        let markerMoved = false;
        let hadValidCoords = false;

        $openMap.addEventListener('click', () => {
            const latInput = $latitude.value;
            const longInput = $longitude.value;
            hadValidCoords = hasCoord(latInput) && hasCoord(longInput);
            markerMoved = false;
            if (hadValidCoords) {
                latitude = Number(latInput);
                longitude = Number(longInput);
            }
            zoom = hadValidCoords ? 4.5 : 2.5;

            openModal('mapModal');
            setTimeout(() => {
                if (!map) {
                    map = L.map('map').setView([latitude, longitude], zoom);
                    L.tileLayer(OSM_TILE_URL).addTo(map);
                    marker = L.marker([latitude, longitude], { draggable: true }).addTo(map);
                    map.on('click', event => {
                        marker.setLatLng(event.latlng);
                        markerMoved = true;
                    });
                    marker.on('dragend', () => {
                        markerMoved = true;
                    });
                } else {
                    map.invalidateSize();
                    map.setView([latitude, longitude], zoom);
                    marker.setLatLng([latitude, longitude]);
                }
            }, 100);
        });

        $closeMap.addEventListener('click', () => {
            if (markerMoved || hadValidCoords) {
                const position = marker.getLatLng().wrap();
                $latitude.value = position.lat;
                $longitude.value = position.lng;
            }
            closeModal('mapModal');
        });

        if (loadPluginSettings) {
            $latitude.value = pluginSettings.latitude ?? '';
            $longitude.value = pluginSettings.longitude ?? '';
            document.getElementById('units').value = pluginSettings.units || 'imperial';
            document.getElementById('customTitle').value = pluginSettings.customTitle || '';
            document.getElementById('highColor').value = pluginSettings.highColor || '#7fd37f';
        } else {
            document.getElementById('units').value = 'imperial';
        }
    });
</script>
